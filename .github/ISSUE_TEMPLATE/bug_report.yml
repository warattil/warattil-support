name: بلاغ عن مشكلة · Bug report
description: خلل في التطبيق أو سلوك غير صحيح · Something in the app is broken or wrong
title: "[مشكلة] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        شكرًا لمساعدتك في تحسين التطبيق. هذا البلاغ **عام**، فلا تذكر فيه بيانات شخصية. وإن كان الأمر يتعلق بنص المصحف، فاذكر الأرقام فقط دون نقل نص الآية.

        Thank you for helping us improve the app. This report is **public**: please leave out personal data. For anything about the Quran text, give numbers only and do not paste the ayah.
  - type: dropdown
    id: device
    attributes:
      label: الجهاز · Device
      options:
        - iPhone
        - iPad
        - Android phone
        - Android tablet
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: إصدار النظام · OS version
      placeholder: "iOS 26.1 / Android 16"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: إصدار التطبيق · App version
      description: من صفحة الإعدادات · From the Settings page
      placeholder: "1.0.3"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: خطوات إعادة المشكلة · Steps to reproduce
      placeholder: |
        1. افتح …
        2. اضغط …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ما كان ينبغي أن يحدث · What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: ما حدث فعلًا · What happened instead
      description: لقطة الشاشة تساعد كثيرًا، على ألّا تتضمن بيانات شخصية · A screenshot helps a lot, as long as it shows no personal data
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: تأكيد · Confirmation
      options:
        - label: لا يتضمن هذا البلاغ بيانات شخصية ولا نصًّا منقولًا من الآيات · This report contains no personal data and no copied ayah text
          required: true
