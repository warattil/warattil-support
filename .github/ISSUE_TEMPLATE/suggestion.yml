name: اقتراح · Suggestion
description: فكرة أو تحسين للتطبيق · An idea or an improvement for the app
title: "[اقتراح] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        نرحّب بجميع الأفكار. اكتبها ببساطة، ولا يلزم أن تكون مكتملة.

        All ideas are welcome. Keep it simple; it does not need to be complete.
  - type: textarea
    id: problem
    attributes:
      label: ما الذي تحاول القيام به ويصعب عليك اليوم؟ · What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: الاقتراح · The suggestion
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: الجزء المعنيّ من التطبيق · Part of the app
      options:
        - المصحف · Mushaf
        - الاستماع والقرّاء · Listening and reciters
        - التحميلات · Downloads
        - الإعدادات · Settings
        - غير ذلك · Something else
  - type: checkboxes
    id: confirm
    attributes:
      label: تأكيد · Confirmation
      options:
        - label: لا يتضمن هذا الاقتراح بيانات شخصية · This suggestion contains no personal data
          required: true
